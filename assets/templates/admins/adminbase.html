<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Network Information Transmission Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
          margin: 0;
          font-family: 'Poppins', sans-serif;
          background-color: #0d1117;
          color: #e6edf3;
          line-height: 1.6;
        }

        /* Navigation */
        nav {
          background-color: #161b22;
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 0.8rem 2rem;
          box-shadow: 0 2px 5px rgba(0,0,0,0.2);
          flex-wrap: wrap;
        }

        nav ul {
          list-style: none;
          display: flex;
          gap: 2rem;
          margin: 0;
          padding: 0;
        }

        nav ul li a {
          color: #c9d1d9;
          text-decoration: none;
          font-weight: 500;
          transition: color 0.3s ease;
        }

        nav ul li a:hover {
          color: #58a6ff;
        }

        .nav-title {
          color: #58a6ff;
          font-size: 1.2rem;
          font-weight: 600;
        }

        header {
          background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
          padding: 1rem;
          text-align: center;
          color: #ffffff;
        }

        header h1 {
          font-size: 1.5rem;
          margin: 0.2rem 0;
        }

        header p {
          margin: 0;
          font-size: 0.95rem;
          color: #d1dbe8;
        }

        .container {
          max-width: 900px;
          margin: 2rem auto;
          padding: 1rem 2rem;
          background-color: #161b22;
          border-radius: 12px;
          box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
          animation: fadeIn 1.2s ease-in-out;
        }

        .container p {
          margin: 1rem 0;
          font-size: 1rem;
          color: #c9d1d9;
        }

        footer {
          text-align: center;
          padding: 2rem 1rem;
          color: #8b949e;
          font-size: 0.9rem;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(30px); }
          to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
          nav {
            flex-direction: column;
            align-items: flex-start;
          }

          nav ul {
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
          }

          .nav-title {
            align-self: flex-end;
            margin-top: 0.5rem;
          }

          header h1 {
            font-size: 1.25rem;
          }

          .container {
            padding: 1rem;
          }
        }
    </style>
</head>
<body>

<!-- Navigation Menu -->
<nav>
    <ul>
        <li><a href="{% url 'AdminHome' %}">Home</a></li>
        <li><a href="{% url 'RegisterUsersView' %}">Users</a></li>
        <li><a href="{% url 'index' %}">Logout</a></li>
    </ul>
    <div class="nav-title">Transmission Security Situation Awareness</div>
</nav>

<header>
    <h1>Network Information Transmission Security</h1>
    <p>Situation Awareness Algorithm on basis of Data Analysis</p>
</header>
{%block contents%}

{%endblock%}
<footer>
    &copy; 2025 Network Security Insights. All rights reserved.
</footer>

<script>
    console.log("Title aligned to right, header height optimized.");
</script>

</body>
</html>
